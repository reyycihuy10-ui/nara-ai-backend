5. BERPIKIR KRITIS
- Analisis pertanyaan sebelum menjawab; periksa konteks dan seluruh pilihan jawaban.
- Jangan terburu-buru menyimpulkan hanya karena kemiripan kata.
- Pertimbangkan jawaban lain bila soal bisa ditafsirkan beberapa cara.
- Jelaskan mengapa jawaban dipilih dan mengapa pilihan lain kurang tepat bila perlu.
- Jangan menyetujui pendapat pengguna secara otomatis bila ada kesalahan; koreksi dengan sopan disertai alasan jelas.

6. KETELITIAN DAN KONSISTENSI
- Periksa ulang semua perhitungan sebelum memberi hasil.
- Pastikan angka, persentase, nama, tanggal, dan informasi tidak saling bertentangan.
- Pastikan kesimpulan benar-benar didukung data yang ada.
- Jangan menyimpulkan sebab-akibat hanya dari dua hal yang muncul bersamaan.
- Jangan mengubah informasi dari pengguna tanpa alasan; seluruh bagian jawaban harus selaras.

7. KEPATUHAN TERHADAP INSTRUKSI
- Ikuti format, gaya bahasa, nada, dan ketentuan yang dipilih pengguna.
- Perhatikan batas jumlah paragraf, poin, kata, dan struktur.
- Jangan melewatkan bagian yang diminta dan jangan menambah informasi yang tidak perlu.
- Bila ada instruksi bertentangan, prioritaskan yang terpenting dan jelaskan keterbatasannya.

8. MEMAHAMI PERTANYAAN
- Pahami maksud pengguna dulu. Bila ada informasi penting yang belum jelas, ajukan SATU pertanyaan klarifikasi yang paling diperlukan.
- Jangan bertanya bila jawabannya sudah ada di percakapan. Bila tugas sudah jelas, langsung kerjakan.

9. KEMAMPUAN MENULIS
- Tulisan runtut, relevan, sesuai format; hindari pengulangan.
- Pakai padanan bahasa Indonesia bila tersedia; perhatikan tata bahasa, ejaan, tanda baca, dan struktur kalimat.
- Bedakan gaya formal, netral, santai, dan persuasif sesuai pilihan pengguna.
- Jangan mengubah inti informasi saat mengubah format tulisan.

10. EVALUASI SEBELUM MENJAWAB
Periksa diam-diam: (1) sesuai pertanyaan? (2) semua instruksi terpenuhi? (3) fakta dan angka benar? (4) ada asumsi tanpa label? (5) ada informasi dibuat-buat? (6) bahasa sesuai usia? (7) mudah dipahami dan tidak bertele-tele? Bila ada kesalahan, perbaiki dulu sebelum mengirim.

11. KEPRIBADIAN
Ramah dan sopan; profesional tetapi tidak kaku; jujur dan bertanggung jawab; kritis dan tidak mudah percaya informasi yang belum terbukti; sabar; tidak merendahkan pengguna yang salah; mendukung belajar mandiri; mengutamakan ketepatan daripada kecepatan.

PRINSIP UTAMA
Lebih baik mengakui belum mengetahui jawaban daripada memberikan informasi yang salah. Tujuan Nara bukan sekadar memberi jawaban, tetapi membantu pengguna memahami, berpikir, dan belajar dengan benar.`}

function vVerify(){var w=vSecs();return '<div class="stars"></div><div class="scr"><div class="top"><button class="rb" data-a="goe">'+ic('back',22)+'</button><span></span><span class="chip"><s></s>ID</span></div><div class="ttl"><h1>Verifikasi emailmu</h1></div><div class="body" style="margin-top:22px"><div class="box" style="padding:28px 20px;border-radius:30px;text-align:center"><p class="mut" style="font-size:16px;line-height:1.6;margin:0">Untuk melanjutkan, masukkan kode 6 angka yang dikirim ke<br><b style="color:var(--tx);word-break:break-all">'+esc(st.vem||'')+'</b></p><p class="mut" style="font-size:15px;line-height:1.8;margin:20px 0 0">Belum menerima email di kotak masuk? <a href="#" id="vr" data-a="vresend" style="color:var(--ac2);text-decoration:underline;'+(w>0?'opacity:.5':'')+'">'+(w>0?'Coba kirim ulang ('+w+'d)':'Coba kirim ulang')+'</a>.<br>Email salah? <a href="#" data-a="goe" style="color:var(--ac2);text-decoration:underline">Ganti alamat email</a><br><span style="font-size:13px">Cek juga folder spam. Kode berlaku 10 menit.</span></p><input class="inp" id="vc" inputmode="numeric" maxlength="6" placeholder="Masukkan kode verifikasi" autocomplete="one-time-code" style="margin:24px 0 14px;text-align:center"><button class="cta" data-a="vgo" style="margin-top:0">Verifikasi alamat email</button></div></div></div>'}
function finishAuth(d,em){S.set('nara_tok',d.token);var k=String((d.user&&d.user.email)||em).toLowerCase();if(!users[k])users[k]={name:d.user.name,pass:'',xp:0,streak:0,hist:[],onb:false,chat:{}};else users[k].name=d.user.name;save();sess=k;S.set('bk_sess2',k);var u=users[k];touch(u);var c=u.chat||{};chats={belajar:(c.belajar||[]).slice(),chat:(c.chat||[]).slice()};if(u.prof)ob=Object.assign(ob,u.prof);st.scr=u.onb?'app':'role';st.tab='home';render()}
async function authCall(p,body){var r=await fx(apiUrl('/api/auth/'+p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},30000),d=await r.json().catch(function(){return {}});d._st=r.status;return d}
Object.assign(act,{auth:async function(){if(st.ab)return;var em=($('#em')||{}).value.trim().toLowerCase(),pw=($('#pw')||{}).value||'',reg=st.emode==='reg',nm=reg?($('#nm')||{}).value.trim():'';if(!/^\S+@\S+\.\S+$/.test(em))return toast('Email tidak valid');if(pw.length<8)return toast('Kata sandi minimal 8 karakter');if(reg&&!nm)return toast('Isi nama lengkap');st.ab=true;var cb=$('.cta');if(cb){cb.disabled=true;cb.textContent='Memproses… mohon tunggu'}try{var d=await authCall(reg?'register':'login',{email:em,password:pw,name:nm});if(d.needVerify){st.vem=em;st.vnext=Date.now()+60000;st.scr='verify';render();return toast(d.error||'Kode dikirim ke emailmu')}if(!d.ok)return toast(d.error||'Gagal, coba lagi');finishAuth(d,em)}catch(e){toast('Tidak bisa terhubung ke server: '+safeError(e))}finally{st.ab=false;var c2=$('.cta');if(c2&&st.scr==='email'){c2.disabled=false;c2.textContent=st.emode==='login'?'Masuk':'Daftar sekarang'}}},
vgo:async function(){if(st.vb)return;var c=(($('#vc')||{}).value||'').trim();if(!/^\d{6}$/.test(c))return toast('Isi 6 angka kode');st.vb=true;try{var d=await authCall('verify',{email:st.vem,code:c});if(!d.ok)return toast(d.error||'Kode salah');finishAuth(d,st.vem)}catch(e){toast('Tidak bisa terhubung ke server')}finally{st.vb=false}},
vresend:async function(){if(st.vrb)return;var w=vSecs();if(w>0)return toast('Tunggu '+w+' detik sebelum kirim ulang');st.vrb=true;try{var d=await authCall('resend',{email:st.vem});if(!d.ok)return toast(d.error||'Gagal mengirim ulang kode');st.vnext=Date.now()+(d.retryAfter||60)*1000;vTick();toast(d.message||'Kode baru dikirim ke emailmu')}catch(e){toast('Tidak bisa terhubung ke server')}finally{st.vrb=false}},
pass:function(){toast('Ganti kata sandi akan tersedia setelah fitur reset lewat email selesai')}});
var _lo7=act.logout;act.logout=function(){if(S.get('nara_tok',null))fx(apiUrl('/api/auth/logout'),{method:'POST'},8000).catch(function(){});S.set('nara_tok',null);_lo7()};
if(sess&&!S.get('nara_tok',null)){act.logout();setTimeout(function(){toast('Akun sekarang disimpan di server. Silakan daftar atau masuk lagi.')},400)}
else if(sess){fx(apiUrl('/api/auth/me'),{},12000).then(function(r){if(r.status===401){S.set('nara_tok',null);act.logout();toast('Sesi berakhir, silakan masuk lagi')}}).catch(function(){})}
function vTick(){var el=document.getElementById('vr');if(!el)return;var w=vSecs();el.textContent=w>0?'Coba kirim ulang ('+w+'d)':'Coba kirim ulang';el.style.opacity=w>0?'.5':'1'}
setInterval(vTick,1000);
document.addEventListener('input',function(e){if(e.target.id!=='vc')return;var v=e.target.value.replace(/\D/g,'').slice(0,6);if(v!==e.target.value)e.target.value=v;if(v.length===6)act.vgo()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='vc'){e.preventDefault();act.vgo()}});
render();
</script>
